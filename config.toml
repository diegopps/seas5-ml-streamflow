# seas5-ml-streamflow configuration — the only file you need to edit.
# Relative paths are relative to this folder (the repository root).

[paths]
discharge_dir = "data/indata/discharge_obs"   # one CSV per catchment: date, Q (m³/s)
seas5_dir     = "data/indata/ecmwf"           # grib/, netcdf_hindcast/, netcdf_forecast/
polygon_dir   = "data/catchments"             # one GeoJSON per catchment: watershed polygon (GRDC), WGS84
era5_dir      = "/p/projects/climate_data_central/reanalysis/ERA5"   # ERA5 hourly, <variable>/<variable>_YYYYMM.nc (PIK copy)
era5_sd_dir   = "data/indata/era5_snow_depth" # ERA5 snow depth, 00 UTC, downloaded from the CDS (pipeline/0_data/era5/)

[seas5_download]
region     = "centralasia"             # "centralasia" or "europe"
first_year = 1981
last_year  = 2025

[seas5_download.regions]               # bounding box: N, W, S, E (degrees)
centralasia = [58, 46, 34, 88]
europe      = [59, -11, 35, 26]

[slurm]
# Shell commands run before Python in every job and helper script (e.g.
# loading a module and activating the conda environment); executed by
# load_env.sh. Leave the block empty if `python` already works in a fresh
# shell. Keep the layout: env_setup = """ on its own line, one command per
# line, closing """ on its own line.
env_setup = """
module load miniforge
source activate FlowCast
"""
